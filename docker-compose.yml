version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: mwewa_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mwewa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mwewa_network

  app:
    build: .
    platform: linux/amd64
    image: softvence/mwewa-app:latest
    container_name: mwewa_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mwewa_db"
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    networks:
      - mwewa_network

volumes:
  postgres_data:
    driver: local

networks:
  mwewa_network:
    driver: bridge
